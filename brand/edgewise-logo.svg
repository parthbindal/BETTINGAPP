<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" aria-label="EDGEWISE logo">
  <defs>
    <radialGradient id="core" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#EAF6FF"/>
      <stop offset="38%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
    <linearGradient id="vec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- dark background so the light mark is visible in any editor theme -->
  <rect width="560" height="240" rx="18" fill="#030407"/>

  <!-- icon -->
  <g transform="translate(40, 60) scale(1)">
    <circle cx="60" cy="60" r="48" fill="none" stroke="rgba(96,165,250,0.14)" stroke-width="1"/>
    <g stroke="url(#vec)" stroke-width="2.8" stroke-linecap="round" fill="none">
      <line x1="106" y1="60" x2="75" y2="60"/><line x1="83" y1="20.2" x2="68.5" y2="44.5"/><line x1="37" y1="20.2" x2="51.5" y2="44.5"/>
      <line x1="14" y1="60" x2="45" y2="60"/><line x1="37" y1="99.8" x2="51.5" y2="75.5"/><line x1="83" y1="99.8" x2="68.5" y2="75.5"/>
    </g>
    <g fill="#38BDF8">
      <circle cx="106" cy="60" r="2.8"/><circle cx="83" cy="20.2" r="2.8"/><circle cx="37" cy="20.2" r="2.8"/>
      <circle cx="14" cy="60" r="2.8"/><circle cx="37" cy="99.8" r="2.8"/><circle cx="83" cy="99.8" r="2.8"/>
    </g>
    <rect x="47.5" y="47.5" width="25" height="25" rx="5" transform="rotate(45 60 60)" fill="url(#core)"/>
    <circle cx="60" cy="60" r="2.8" fill="#EAF6FF"/>
  </g>

  <!-- wordmark (uses a geometric sans fallback if Space Grotesk is unavailable) -->
  <text x="200" y="134" font-family="'Space Grotesk', 'Futura', 'Century Gothic', sans-serif" font-size="46" font-weight="600" letter-spacing="10" fill="#F8FAFC">EDGEWISE</text>
  <text x="202" y="166" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" letter-spacing="4.4" fill="#8A94A6">PREDICTION-MARKET INTELLIGENCE</text>
</svg>
